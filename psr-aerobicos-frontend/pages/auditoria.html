<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoría de Actividad | PSR Aeróbicos</title>
  <link rel="icon" type="image/png" href="../img/logo-psr-pestaña.png">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="mobile-topbar">
      <span class="mobile-topbar-brand">PSR • Aeróbicos</span>
      <button type="button" class="mobile-menu-btn" id="btn-mobile-menu" aria-label="Abrir menú">
        <i class="ph-bold ph-list"></i>
      </button>
    </header>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <!-- Historial de Auditoría alimentado por los Triggers de Base de Datos -->
    <main class="app-main">
      <div class="page-container">
        <header class="page-header">
          <div>
            <h1 class="page-title">
              <i class="ph-bold ph-shield-check"></i>
              <span>Auditoría de Actividad</span>
            </h1>
            <p class="page-subtitle">
              Bitácora de modificaciones y eliminaciones capturadas automáticamente por triggers (Solo lectura)
            </p>
          </div>

          <button type="button" id="btn-refrescar-auditoria" class="btn-psr-secondary">
            <i class="ph-bold ph-arrows-clockwise"></i>
            <span>Refrescar</span>
          </button>
        </header>

        <!-- Filtros por tabla afectada y rango de fechas -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
          <div class="filter-pills" id="auditoria-table-filters">
            <button type="button" class="filter-pill is-active" data-table="all">Todo</button>
            <button type="button" class="filter-pill" data-table="movimiento_cuenta">Movimientos / Pagos</button>
            <button type="button" class="filter-pill" data-table="tarifa">Tarifa</button>
            <button type="button" class="filter-pill" data-table="sesion">Sesiones</button>
            <button type="button" class="filter-pill" data-table="persona">Personas</button>
          </div>

          <div class="d-flex flex-wrap align-items-center gap-2">
            <input type="date" id="auditoria-desde" class="psr-input py-1 px-2" style="width: 145px;" aria-label="Fecha desde">
            <span class="text-secondary small">a</span>
            <input type="date" id="auditoria-hasta" class="psr-input py-1 px-2" style="width: 145px;" aria-label="Fecha hasta">
          </div>
        </div>

        <div id="auditoria-alert-box" class="psr-alert psr-alert-error d-none" role="alert">
          <span>Error al consultar el historial de auditoría.</span>
        </div>

        <!-- Listado de registros de historial_auditoria / vista_historial_cambios -->
        <section class="audit-list" id="auditoria-records-list">
          <div class="psr-card text-center text-secondary py-4">
            Cargando bitácora de auditoría...
          </div>
        </section>

        <div id="auditoria-paginacion" class="d-flex align-items-center justify-content-center gap-3 mt-3"></div>
      </div>
    </main>
  </div>

  <script src="../js/libs/bootstrap.bundle.min.js"></script>
  <script src="../js/utils/config.js"></script>
  <script src="../js/utils/sesion.js"></script>
  <script src="../js/utils/validaciones.js"></script>
  <script src="../js/utils/cliente-http.js"></script>
  <script src="../js/utils/layout.js"></script>
  <script src="../js/pages/auditoria.js"></script>
</body>
</html>
